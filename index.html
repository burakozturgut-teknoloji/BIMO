<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bimo 1.8</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 30px 20px;
      text-align: center;
    }

    .logo {
      font-size: 64px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 38px;
    }

    .version {
      color: #8f9aaa;
      margin-top: 5px;
    }

    .slogan {
      margin: 30px 0;
      font-size: 20px;
      font-weight: bold;
    }
.menu {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 20px;
}

.menu button {
    width: 100%;
    margin-top: 0;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: white;
    color: #0b0f14;
    font-size: 17px;
    font-weight: bold;
}
.duration-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
}

.duration-options button {
    width: 100%;
    margin-top: 0;
    padding: 12px;
    font-size: 15px;
}
    .box {
      background: #151b23;
      border-radius: 18px;
      padding: 20px;
      margin-top: 20px;
    }

    textarea {
      width: 100%;
      height: 120px;
      resize: none;
      border: none;
      outline: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 16px;
      background: #0d1218;
      color: white;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: white;
      color: #0b0f14;
      font-size: 17px;
      font-weight: bold;
    }

    #response {
      margin-top: 20px;
      line-height: 1.6;
      color: #d7dde5;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">B</div>

    <h1>Bimo</h1>

    <div class="version">Bimo 1.8</div>

    <div class="slogan">
      Yapamama lüksümüz yoktur.
    </div>
<div class="menu">
    <button onclick="focusQuestion()">🎯 Hedef Belirle</button>
    <button onclick="showInfo()">ℹ️ Bimo Hakkında</button>
    <button onclick="clearQuestion()">🗑️ Temizle</button>
</div>
    <div class="box">

      <textarea id="question" autofocus
        placeholder="Bimo'ya ne yapmak istediğini yaz..."></textarea>
<input
  id="duration"
  type="text"
  placeholder="Günde ne kadar zaman ayırabilirsin? (örn. 1 saat)"
>
<div class="duration-options">
    <button type="button" onclick="setDuration('15 dakika')">15 dk</button>
    <button type="button" onclick="setDuration('30 dakika')">30 dk</button>
    <button type="button" onclick="setDuration('1 saat')">1 saat</button>
    <button type="button" onclick="setDuration('2 saat')">2 saat</button>
</div>
      <button onclick="bimo()">Bimo'ya Sor</button>

      <div id="response"></div>

    </div>

  </div>

  <script>
  
function bimo() {
  const question =
    document.getElementById("question").value.trim();

  const duration =
    document.getElementById("duration").value.trim();

  const response =
    document.getElementById("response");

  if (!question) {
    response.innerHTML =
      "Önce hedefini yaz.";
    return;
  }

  if (!duration) {
    response.innerHTML =
      "Hedefin için günde ne kadar zaman ayırabileceğini yaz.";
    return;
  }

  response.innerHTML =
    "Bimo kişisel planını hazırlıyor... 🧠";

  setTimeout(function() {

    const text = question.toLowerCase();

    let category = "Genel";
let plan = [];

let minutes = 30;

const minuteMatch = duration.match(/(\d+)\s*dakika/i);
const hourMatch = duration.match(/(\d+)\s*saat/i);

if (hourMatch) {
    minutes = parseInt(hourMatch[1]) * 60;
} else if (minuteMatch) {
    minutes = parseInt(minuteMatch[1]);
if (
    text.includes("spor") ||
    text.includes("fitness") ||
    text.includes("kas") ||
    text.includes("antrenman")
) {
    category = "Spor / Fitness";

    if (
        text.includes("kilo") ||
        text.includes("yağ") ||
        text.includes("zayıf")
    ) {
        plan = [
            "Isınma ve hareket hazırlığı – " + time1 + " dk",
            "Kalori yakımına odaklan – " + time2 + " dk",
            "Kardiyo / kondisyon çalışması – " + time3 + " dk",
            "Soğuma ve toparlanma – " + time4 + " dk",
            "Bugünkü ilerlemeni değerlendir – " + time5 + " dk"
        ];
    } else if (
        text.includes("kas") ||
        text.includes("güç") ||
        text.includes("kuvvet")
    ) {
        plan = [
            "Isınma ve hazırlık – " + time1 + " dk",
            "Ana kuvvet çalışması – " + time2 + " dk",
            "Kas gruplarına odaklan – " + time3 + " dk",
            "Soğuma ve toparlanma – " + time4 + " dk",
            "İlerlemeni takip et – " + time5 + " dk"
        ];
    } else {
        plan = [
            "Isınma ve hazırlık – " + time1 + " dk",
            "Ana antrenmanı uygula – " + time2 + " dk",
            "Kuvvet / kondisyon çalışması – " + time3 + " dk",
            "Soğuma ve toparlanma – " + time4 + " dk",
            "Bugünkü ilerlemeni değerlendir – " + time5 + " dk"
        ];
    }

} else if (
    text.includes("ders") ||
    text.includes("sınav") ||
    text.includes("öğren") ||
    text.includes("ingilizce")
) {
    category = "Eğitim / Öğrenme";

    if (text.includes("ingilizce")) {
        plan = [
            "Yeni kelimeleri öğren – " + time1 + " dk",
            "Okuma / dinleme çalışması yap – " + time2 + " dk",
            "Cümle kurma ve uygulama – " + time3 + " dk",
            "Öğrendiklerini tekrar et – " + time4 + " dk",
            "Bugünkü gelişimini değerlendir – " + time5 + " dk"
        ];
    } else if (
        text.includes("sınav") ||
        text.includes("ders")
    ) {
        plan = [
            "Konuyu gözden geçir – " + time1 + " dk",
            "Ana konuyu çalış – " + time2 + " dk",
            "Soru çözümü yap – " + time3 + " dk",
            "Yanlışlarını tekrar et – " + time4 + " dk",
            "Bugünkü performansını değerlendir – " + time5 + " dk"
        ];
    } else {
        plan = [
            "Konuyu gözden geçir – " + time1 + " dk",
            "Ana konuyu öğren – " + time2 + " dk",
            "Uygulama yap – " + time3 + " dk",
            "Tekrar yap – " + time4 + " dk",
            "İlerlemeni değerlendir – " + time5 + " dk"
        ];
    }

} else if (
    text.includes("iş") ||
    text.includes("para") ||
    text.includes("kariyer") ||
    text.includes("girişim")
) {
    category = "Kariyer / İş";

    if (
        text.includes("cv") ||
        text.includes("özgeçmiş") ||
        text.includes("iş bul")
    ) {
        plan = [
            "Mevcut CV'ni incele – " + time1 + " dk",
            "Deneyim ve becerilerini düzenle – " + time2 + " dk",
            "CV'ni hedefe göre geliştir – " + time3 + " dk",
            "Eksiklerini kontrol et – " + time4 + " dk",
            "Bir sonraki başvuruyu belirle – " + time5 + " dk"
        ];
    } else if (
        text.includes("girişim") ||
        text.includes("iş kur")
    ) {
        plan = [
            "Fikrini netleştir – " + time1 + " dk",
            "Hedef kitleni belirle – " + time2 + " dk",
            "Uygulanabilir bir adım seç – " + time3 + " dk",
            "Sonuçları değerlendir – " + time4 + " dk",
            "Bir sonraki adımı belirle – " + time5 + " dk"
        ];
    } else {
        plan = [
            "Mevcut durumunu değerlendir – " + time1 + " dk",
            "Gerekli becerileri geliştir – " + time2 + " dk",
            "Uygulanabilir bir adım at – " + time3 + " dk",
            "Sonuçlarını değerlendir – " + time4 + " dk",
            "Bir sonraki adımı belirle – " + time5 + " dk"
        ];
    }

} else {
    plan = [
        "Hedefini netleştir – " + time1 + " dk",
        "En önemli adıma odaklan – " + time2 + " dk",
        "Uygulamaya geç – " + time3 + " dk",
        "İlerlemeni kontrol et – " + time4 + " dk",
        "Bir sonraki adımı belirle – " + time5 + " dk"
    ];
}

    response.innerHTML =
      "<strong>Bimo:</strong><br><br>" +
      "Hedefini analiz ettim. 🧠<br><br>" +
      "<strong>Kategori:</strong> " +
      category +
      "<br><br>" +
      "<strong>Günlük Ayırabileceğin Süre:</strong> " +
      duration +
      "<br><br>" +
      "<strong>Kişisel Yol Haritan:</strong><br>" +
      plan.map(function(step, index) {
        return (index + 1) + ". " + step;
      }).join("<br>") +
      "<br><br>" +
      "<strong>Yapamama lüksümüz yoktur. 🚀</strong>";

  }, 800);
}
function focusQuestion() {
    document.getElementById("question").focus();
}

function showInfo() {
    document.getElementById("response").innerHTML =
        "<strong>🧠 Bimo 1.8</strong><br><br>" +
        "Bimo, hedeflerini gerçekleştirmek için sana kişisel bir yol haritası oluşturur.<br><br>" +
        "🎯 Hedefini yaz.<br>" +
        "⏱️ Günlük ayırabileceğin zamanı belirt.<br>" +
        "🚀 Bimo sana 5 adımlı bir plan hazırlasın.<br><br>" +
        "<strong>Yapamama lüksümüz yoktur. 🚀</strong>";
}
function setDuration(value) {
    document.getElementById("duration").value = value;
}
function clearQuestion() {
    document.getElementById("question").value = "";
    document.getElementById("response").innerHTML = "";
}  </script>

</body>
</html>
