<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bimo 1.4</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 30px 20px;
      text-align: center;
    }

    .logo {
      font-size: 64px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 38px;
    }

    .version {
      color: #8f9aaa;
      margin-top: 5px;
    }

    .slogan {
      margin: 30px 0;
      font-size: 20px;
      font-weight: bold;
    }
.menu {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 20px;
}

.menu button {
    width: 100%;
    margin-top: 0;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: white;
    color: #0b0f14;
    font-size: 17px;
    font-weight: bold;
}
.duration-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
}

.duration-options button {
    width: 100%;
    margin-top: 0;
    padding: 12px;
    font-size: 15px;
}
    .box {
      background: #151b23;
      border-radius: 18px;
      padding: 20px;
      margin-top: 20px;
    }

    textarea {
      width: 100%;
      height: 120px;
      resize: none;
      border: none;
      outline: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 16px;
      background: #0d1218;
      color: white;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: white;
      color: #0b0f14;
      font-size: 17px;
      font-weight: bold;
    }

    #response {
      margin-top: 20px;
      line-height: 1.6;
      color: #d7dde5;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">B</div>

    <h1>Bimo</h1>

    <div class="version">Bimo 1.4</div>

    <div class="slogan">
      Yapamama lüksümüz yoktur.
    </div>
<div class="menu">
    <button onclick="focusQuestion()">🎯 Hedef Belirle</button>
    <button onclick="showInfo()">ℹ️ Bimo Hakkında</button>
    <button onclick="clearQuestion()">🗑️ Temizle</button>
</div>
    <div class="box">

      <textarea id="question" autofocus
        placeholder="Bimo'ya ne yapmak istediğini yaz..."></textarea>
<input
  id="duration"
  type="text"
  placeholder="Günde ne kadar zaman ayırabilirsin? (örn. 1 saat)"
>
<div class="duration-options">
    <button type="button" onclick="setDuration('15 dakika')">15 dk</button>
    <button type="button" onclick="setDuration('30 dakika')">30 dk</button>
    <button type="button" onclick="setDuration('1 saat')">1 saat</button>
    <button type="button" onclick="setDuration('2 saat')">2 saat</button>
</div>
      <button onclick="bimo()">Bimo'ya Sor</button>

      <div id="response"></div>

    </div>

  </div>

  <script>
  
function bimo() {
  const question =
    document.getElementById("question").value.trim();

  const duration =
    document.getElementById("duration").value.trim();

  const response =
    document.getElementById("response");

  if (!question) {
    response.innerHTML =
      "Önce hedefini yaz.";
    return;
  }

  if (!duration) {
    response.innerHTML =
      "Hedefin için günde ne kadar zaman ayırabileceğini yaz.";
    return;
  }

  response.innerHTML =
    "Bimo kişisel planını hazırlıyor... 🧠";

  setTimeout(function() {

    const text = question.toLowerCase();

    let category = "Genel";
    let plan = [];

    if (
      text.includes("spor") ||
      text.includes("fitness") ||
      text.includes("kas") ||
      text.includes("antrenman")
    ) {
      category = "Spor / Fitness";

      plan = [
        "Hedefini net olarak belirle.",
        "Haftalık antrenman programını oluştur.",
        "Antrenman günlerini planla.",
        "Beslenme ve dinlenmeye dikkat et.",
        "Her hafta ilerlemeni kontrol et."
      ];

    } else if (
      text.includes("ders") ||
      text.includes("sınav") ||
      text.includes("öğren") ||
      text.includes("ingilizce")
    ) {
      category = "Eğitim / Öğrenme";

      plan = [
        "Öğrenmek istediğin konuyu belirle.",
        "Günlük çalışma süreni planla.",
        "Konuyu küçük parçalara böl.",
        "Düzenli tekrar yap.",
        "Her hafta ilerlemeni kontrol et."
      ];

    } else if (
      text.includes("iş") ||
      text.includes("para") ||
      text.includes("kariyer") ||
      text.includes("girişim")
    ) {
      category = "Kariyer / İş";

      plan = [
        "Hedefini netleştir.",
        "Mevcut durumunu değerlendir.",
        "Gerekli adımları belirle.",
        "Her gün küçük bir ilerleme yap.",
        "Sonuçlarını düzenli olarak değerlendir."
      ];

    } else {
      plan = [
        "Hedefini net olarak belirle.",
        "Büyük hedefi küçük adımlara böl.",
        "İlk uygulanabilir adımı seç.",
        "Her gün ilerleme kaydet.",
        "Sonuçlarını değerlendir ve planını geliştir."
      ];
    }

    response.innerHTML =
      "<strong>Bimo:</strong><br><br>" +
      "Hedefini analiz ettim. 🧠<br><br>" +
      "<strong>Kategori:</strong> " +
      category +
      "<br><br>" +
      "<strong>Günlük Ayırabileceğin Süre:</strong> " +
      duration +
      "<br><br>" +
      "<strong>Kişisel Yol Haritan:</strong><br>" +
      plan.map(function(step, index) {
        return (index + 1) + ". " + step;
      }).join("<br>") +
      "<br><br>" +
      "<strong>Yapamama lüksümüz yoktur. 🚀</strong>";

  }, 800);
}
function focusQuestion() {
    document.getElementById("question").focus();
}

function showInfo() {
    document.getElementById("response").innerHTML =
        "<strong>🧠 Bimo 1.4</strong><br><br>" +
        "Bimo, hedeflerini gerçekleştirmek için sana kişisel bir yol haritası oluşturur.<br><br>" +
        "🎯 Hedefini yaz.<br>" +
        "⏱️ Günlük ayırabileceğin zamanı belirt.<br>" +
        "🚀 Bimo sana 5 adımlı bir plan hazırlasın.<br><br>" +
        "<strong>Yapamama lüksümüz yoktur. 🚀</strong>";
}
function setDuration(value) {
    document.getElementById("duration").value = value;
}
function clearQuestion() {
    document.getElementById("question").value = "";
    document.getElementById("response").innerHTML = "";
}  </script>

</body>
</html>
